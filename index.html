<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDs Bot Status</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    width: 320px;
    box-shadow: 0 0 40px rgba(0,0,0,0.3);
    animation: fadeIn 1s ease;
}

h1 {
    margin-bottom: 10px;
    font-weight: 700;
}

.status {
    font-size: 26px;
    font-weight: bold;
    margin: 20px 0;
}

.online {
    color: #4caf50;
}

.offline {
    color: #ff5252;
}

.info {
    opacity: 0.8;
    margin-top: 10px;
}

footer {
    margin-top: 30px;
    font-size: 13px;
    opacity: 0.5;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="card">
    <h1>🤖 KDs Bot</h1>

    <div id="status" class="status">Verificando...</div>

    <div class="info" id="responseTime"></div>
    <div class="info" id="lastCheck"></div>

    <footer>
        Dashboard Status
    </footer>
</div>

<script>

const API_KEY = "u3311325-397b975848670a6dc27d5536";
const MONITOR_ID = "802342990";

async function checkBot() {

    try {
        const res = await fetch("https://api.uptimerobot.com/v2/getMonitors", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: `api_key=${API_KEY}&monitors=${MONITOR_ID}&format=json`
        });

        const data = await res.json();

        const monitor = data.monitors[0];
        const statusDiv = document.getElementById("status");

        if (monitor.status === 2) {
            statusDiv.textContent = "ONLINE 🟢";
            statusDiv.className = "status online";
        } else {
            statusDiv.textContent = "OFFLINE 🔴";
            statusDiv.className = "status offline";
        }

        document.getElementById("responseTime").textContent =
            "Response Time: " + monitor.response_times?.[0]?.value + " ms" || "";

        document.getElementById("lastCheck").textContent =
            "Último chequeo: " + new Date().toLocaleTimeString();

    } catch (error) {
        document.getElementById("status").textContent = "Error conectando API";
    }
}

checkBot();
setInt
