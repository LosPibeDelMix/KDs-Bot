<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KDs Bot Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
        }

        h1 {
            margin-bottom: 25px;
            font-size: 24px;
        }

        .status {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
        }

        .online {
            background: #065f46;
            color: #10b981;
        }

        .offline {
            background: #7f1d1d;
            color: #ef4444;
        }

        .info {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.9;
        }

        .refresh {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🤖 KDs Bot Dashboard</h1>

    <div id="status" class="status">
        Verificando...
    </div>

    <div class="info" id="ping"></div>
    <div class="info" id="servers"></div>
    <div class="info" id="users"></div>
    <div class="info" id="uptime"></div>

    <div class="refresh">
        Actualiza cada 15 segundos
    </div>
</div>

<script>
    const API_URL = "https://railway.com/project/5ecb9c8b-26e3-47da-a30c-7edd9a4cca99?environmentId=916b99d0-2245-4505-96a5-62ae7f357e51";

    function formatUptime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        return `${hours}h ${minutes}m ${seconds}s`;
    }

    async function checkBot() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();

            const statusDiv = document.getElementById("status");

            if (data.online) {
                statusDiv.textContent = "ONLINE 🟢";
                statusDiv.className = "status online";
            } else {
                statusDiv.textContent = "OFFLINE 🔴";
                statusDiv.className = "status offline";
            }

            document.getElementById("ping").textContent =
                "Ping: " + data.ping + " ms";

            document.getElementById("servers").textContent =
                "Servidores: " + data.servers;

            document.getElementById("users").textContent =
                "Usuarios cacheados: " + data.users;

            document.getElementById("uptime").textContent =
                "Uptime: " + formatUptime(data.uptime);

        } catch (error) {
            const statusDiv = document.getElementById("status");
            statusDiv.textContent = "OFFLINE 🔴";
            statusDiv.className = "status offline";
        }
    }

    checkBot();
    setInterval(checkBot, 15000);
</script>

</body>
</html>
